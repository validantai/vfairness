{# ── Method Comparison SVG Template ── #}
{# ── vfairness Design System v4 · 680-width layout ── #}

{# ── Height computation ── #}
{% set header_h = 140 %}
{% set table_header_h = 40 %}
{% set table_row_h = 40 %}
{% set table_h = table_header_h + methods|length * table_row_h + 10 %}
{% set exp_h = 0 %}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}
{% set _exp_lines = _exp.split('\n') %}
{% set exp_h = 44 + _exp_lines|length * 16 %}
{% endif %}
{% set table_y = header_h %}
{% set exp_y = table_y + table_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}

{# ── COULD NOT CHECK (see the CRITICAL note in _could_not_check.svg) ──
   Until 2026-08-27 an empty method list never reached this template at all: the
   adapter returned "" and a caller with save_path wrote a 0-byte SVG with no
   error. It reaches here now, and an empty PASS/FAIL table is not an outcome
   either, so the table goes and the panel states the absence. #}
{% if not_assessable %}
{% set _na_lines = (not_assessable_reason|default('', true)|wordwrap(88)).split('\n') %}
{% set na_h = 76 + _na_lines|length * 18 %}
{% set na_y = header_h %}
{% set exp_y = na_y + na_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}
{% endif %}

<svg xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif" viewBox="0 0 680 {{ total_h }}">
{% include '_shared_defs.svg' %}

{# ── Background ── #}
<rect width="680" height="{{ total_h }}" fill="#f8f9fb"/>

{# ── Header bar ── #}
<rect width="680" height="52" fill="#ffffff"/>
<use href="#validant-logo" x="36" y="15" width="110" height="30"/>
{% if timestamp %}<text x="644" y="32" text-anchor="end" font-size="9" fill="#94a3b8">{{ timestamp }}</text>{% endif %}
<rect x="36" y="52" width="644" height="1.5" rx="0.75" fill="url(#accent)"/>

{# ── Title / Subtitle ── #}
<text x="36" y="96" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.3">{{ title }}</text>
{% if not_assessable %}
<text x="36" y="122" font-size="10" fill="#64748b">No training method was evaluated</text>
{% include '_could_not_check.svg' %}
{% else %}
{# The method count is a count of rows SUPPLIED, and a count reads as a
   measurement, so the ungraded ones are named right here rather than left for
   the reader to assume were evaluated. #}
{# The ungraded count is split by KIND, because "constraint not evaluated" is  #}
{# false about a method that reported one and whose result is vacuous.          #}
<text x="36" y="122" font-size="10" fill="#64748b">Accuracy and fairness violation per method: {{ methods|length }} methods evaluated{% if n_ungraded %} ({% if n_vacuous and n_vacuous == n_ungraded %}{{ n_vacuous }} verdict vacuous{% elif n_vacuous %}{{ n_ungraded - n_vacuous }} constraint not evaluated, {{ n_vacuous }} verdict vacuous{% else %}{{ n_ungraded }} constraint not evaluated{% endif %}){% endif %}</text>

{# ══════════════════════════════════════════════════════════════════ #}
{# Methods table with inline bars                                    #}
{# ══════════════════════════════════════════════════════════════════ #}
<rect x="36" y="{{ table_y }}" width="644" height="{{ table_h }}" rx="10" fill="#ffffff"/>

{# Column headers #}
<text x="56" y="{{ table_y + 24 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">METHOD</text>
<text x="200" y="{{ table_y + 24 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">ACCURACY</text>
<text x="430" y="{{ table_y + 24 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">VIOLATION</text>
<text x="610" y="{{ table_y + 24 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">STATUS</text>
<line x1="56" y1="{{ table_y + 32 }}" x2="660" y2="{{ table_y + 32 }}" stroke="#475569" stroke-width="0.75"/>

{% for m in methods %}
{% set ry = table_y + table_header_h + loop.index0 * table_row_h %}

{# CRITICAL, per row. Two separate defects lived in this loop.                  #}
{# 1. Every verdict branch was written `{% if m.satisfied %} ... {% else %}     #}
{#    FAIL`, so a method whose constraint was NEVER EVALUATED took the FAIL arm #}
{#    and drew a red row stripe, a red violation bar and a red FAIL chip. A     #}
{#    fabricated failure sends a reader after a violation that does not exist.  #}
{# 2. Both bar widths MULTIPLY the reported number, so a row with no accuracy   #}
{#    raised TypeError here and the adapter returned a bare empty string for    #}
{#    the whole chart. One unmeasured cell must cost that cell, never the page. #}
{# Row background for failed methods #}
{% if m.graded and not m.satisfied %}
<rect x="36" y="{{ ry }}" width="644" height="{{ table_row_h }}" fill="#fef2f2" opacity="0.3"/>
<rect x="36" y="{{ ry }}" width="2.5" height="{{ table_row_h }}" fill="#dc2626"/>
{% endif %}

{# Method name #}
<text x="56" y="{{ ry + 24 }}" font-size="10.5" font-weight="500" fill="#0f172a">{{ m.name|truncate_text(20) }}</text>

{# Accuracy bar #}
{% set acc_bar_x = 200 %}
{% set acc_bar_max_w = 180 %}
<rect x="{{ acc_bar_x }}" y="{{ ry + 12 }}" width="{{ acc_bar_max_w }}" height="14" rx="4" fill="#f1f5f9"/>
{% if m.accuracy_measured %}
{% set acc_bar_w = (m.accuracy * acc_bar_max_w)|int %}
{% if acc_bar_w < 4 %}{% set acc_bar_w = 4 %}{% endif %}
<rect x="{{ acc_bar_x }}" y="{{ ry + 12 }}" width="{{ acc_bar_w }}" height="14" rx="4" fill="#3b82f6" opacity="0.85"/>
<text x="{{ acc_bar_x + acc_bar_max_w + 6 }}" y="{{ ry + 24 }}" font-size="10" font-weight="600" fill="#3b82f6">{{ m.accuracy|f3 }}</text>
{% else %}
{# Set INSIDE the empty track. Rasterised and read: at the number's own origin, #}
{# to the right of the track, this phrase ran into the violation bar at x=430.  #}
{# The producer's own WHY rides along as the element's accessible name: it does #}
{# not fit an unwrapped <text> inside a 180px bar track, and dropping it is how #}
{# a correct measurement ends up with no reader. See _method_state.            #}
<text x="{{ acc_bar_x + acc_bar_max_w / 2 }}" y="{{ ry + 24 }}" text-anchor="middle" font-size="8" font-style="italic" fill="#64748b">not measured{% if m.accuracy_reason %}<title>Accuracy not measured: {{ m.accuracy_reason }}</title>{% endif %}</text>
{% endif %}

{# Violation bar #}
{% set viol_bar_x = 430 %}
{% set viol_bar_max_w = 120 %}
{% set viol_color = '#64748b' if not m.graded else ('#059669' if m.satisfied else '#dc2626') %}
<rect x="{{ viol_bar_x }}" y="{{ ry + 12 }}" width="{{ viol_bar_max_w }}" height="14" rx="4" fill="#f1f5f9"/>
{% if m.violation_measured %}
{% set viol_bar_w = (m.violation * viol_bar_max_w)|int %}
{% if viol_bar_w < 4 %}{% set viol_bar_w = 4 %}{% endif %}
{% if viol_bar_w > viol_bar_max_w %}{% set viol_bar_w = viol_bar_max_w %}{% endif %}
<rect x="{{ viol_bar_x }}" y="{{ ry + 12 }}" width="{{ viol_bar_w }}" height="14" rx="4" fill="{{ viol_color }}" opacity="0.8"/>
<text x="{{ viol_bar_x + viol_bar_max_w + 6 }}" y="{{ ry + 24 }}" font-size="10" font-weight="600" fill="{{ viol_color }}">{{ m.violation|f3 }}</text>
{% else %}
<text x="{{ viol_bar_x + viol_bar_max_w / 2 }}" y="{{ ry + 24 }}" text-anchor="middle" font-size="8" font-style="italic" fill="#64748b">not measured</text>
{% endif %}

{# Status badge #}
{# A VACUOUS verdict is not an ABSENT one, so it gets its own chip rather than  #}
{# the generic NOT CHECKED. A method that collapsed to a constant prediction    #}
{# DID report a constraint result; it is satisfied by construction and measures #}
{# nothing. Before this branch existed the row drew a green PASS chip, with     #}
{# parameters['degenerate_constant_predictions'] dropped at the adapter.        #}
{% if m.vacuous %}
<rect x="596" y="{{ ry + 10 }}" width="62" height="18" rx="9" fill="#f1f5f9"/>
<text x="627" y="{{ ry + 23 }}" text-anchor="middle" font-size="7" font-weight="600" fill="#64748b">VACUOUS<title>{{ m.vacuous_reason }}</title></text>
{% elif not m.graded %}
<rect x="596" y="{{ ry + 10 }}" width="62" height="18" rx="9" fill="#f1f5f9"/>
<text x="627" y="{{ ry + 23 }}" text-anchor="middle" font-size="7" font-weight="600" fill="#64748b">NOT CHECKED</text>
{% elif m.satisfied %}
<rect x="610" y="{{ ry + 10 }}" width="48" height="18" rx="9" fill="#ecfdf5"/>
<text x="634" y="{{ ry + 23 }}" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">PASS</text>
{% else %}
<rect x="610" y="{{ ry + 10 }}" width="48" height="18" rx="9" fill="#fef2f2"/>
<text x="634" y="{{ ry + 23 }}" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">FAIL</text>
{% endif %}

{% if not loop.last %}
<line x1="56" y1="{{ ry + table_row_h }}" x2="660" y2="{{ ry + table_row_h }}" stroke="#f1f5f9" stroke-width="0.5"/>
{% endif %}
{% endfor %}
{% endif %}{# end: not not_assessable #}

{# ══════════════════════════════════════════════════════════════════ #}
{# Explanation panel                                                  #}
{# ══════════════════════════════════════════════════════════════════ #}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
<rect x="36" y="{{ exp_y }}" width="644" height="{{ 44 + _exp_lines|length * 16 }}" rx="10" fill="#ffffff"/>
<rect x="56" y="{{ exp_y }}" width="604" height="0.5" fill="#475569"/>
<text x="56" y="{{ exp_y + 26 }}" font-size="11" font-weight="700" fill="#0f172a">Explanation</text>
{% for _line in _exp_lines %}<text x="56" y="{{ exp_y + 50 + loop.index0 * 16 }}" font-size="9.5" fill="#6b7280">{{ _line }}</text>{% endfor %}
{% endif %}

{# ── Bottom accent + icon ── #}
<rect x="36" y="{{ total_h - 14 }}" width="618" height="1.5" rx="0.75" fill="url(#accent)"/>
<use href="#validant-icon" x="658" y="{{ total_h - 25 }}" width="22" height="22" opacity="0.55"/>

</svg>
