{# ── Fairness Metrics · Bar Chart ── #}
{# ── vfairness G1 Design System ── #}

{# ── Height computation ── #}
{% set badge_h = 36 %}
{% set row_h = 44 %}
{% set chart_h = bars|length * row_h + 30 %}
{% set content_h = badge_h + 16 + chart_h %}
{% set exp_h = 0 %}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}
{% set _exp_lines = _exp.split('\n') %}
{% set exp_h = 44 + _exp_lines|length * 16 %}
{% endif %}
{% set exp_y = 140 + content_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 {{ total_h }}" font-family="'Inter','Segoe UI',system-ui,sans-serif">
{% include '_shared_defs.svg' %}

{# ── Background ── #}
<rect width="680" height="{{ total_h }}" fill="#f8f9fb"/>

{# ── Header bar ── #}
<rect width="680" height="52" fill="#ffffff"/>
<use href="#validant-logo" x="36" y="15" width="110" height="30"/>
{% if timestamp %}<text x="644" y="32" text-anchor="end" font-size="9" fill="#94a3b8">{{ timestamp }}</text>{% endif %}
<rect x="36" y="52" width="644" height="1.5" rx="0.75" fill="url(#accent)"/>

{# ── Title / Subtitle ── #}
<text x="36" y="96" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.3">{{ title }}</text>
<text x="36" y="122" font-size="10" fill="#64748b">{{ subtitle }}</text>

{# ── Stats badges ── #}
{# PASSED and FAIR RATE are fractions of CHECKED metrics. When nothing was
   checked the tiles are SUPPRESSED, not zeroed: "0 / 0" and "0%" read as a
   measured total failure exactly as "5 / 5" and "100%" read as a measured
   pass, and neither happened. `not_assessable` is absent for every existing
   caller, so this branch is opt-in and the default render is unchanged. #}
{% set badge_y = 140 %}
{% if not_assessable %}
<rect x="36" y="{{ badge_y }}" width="270" height="{{ badge_h }}" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="{{ badge_y + 14 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">ASSESSABILITY</text>
<text x="56" y="{{ badge_y + 30 }}" font-size="13" font-weight="700" fill="#64748b">· NOT ASSESSABLE</text>
{% else %}
{% set pass_pct = n_passed / max(1, n_total) %}
<rect x="36" y="{{ badge_y }}" width="140" height="{{ badge_h }}" rx="10" fill="#ffffff"/>
<text x="56" y="{{ badge_y + 14 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">PASSED</text>
<text x="56" y="{{ badge_y + 30 }}" font-size="13" font-weight="700" fill="{{ '#059669' if pass_pct >= 0.7 else '#f59e0b' if pass_pct >= 0.4 else '#dc2626' }}">{{ n_passed }} / {{ n_total }}</text>

<rect x="186" y="{{ badge_y }}" width="120" height="{{ badge_h }}" rx="10" fill="#ffffff"/>
<text x="206" y="{{ badge_y + 14 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">FAIR RATE</text>
<text x="206" y="{{ badge_y + 30 }}" font-size="13" font-weight="700" fill="{{ '#059669' if pass_pct >= 0.7 else '#f59e0b' if pass_pct >= 0.4 else '#dc2626' }}">{{ (pass_pct * 100)|int }}%</text>
{% endif %}
{% if n_unknown %}
<rect x="316" y="{{ badge_y }}" width="180" height="{{ badge_h }}" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="336" y="{{ badge_y + 14 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">COULD NOT CHECK</text>
<text x="336" y="{{ badge_y + 30 }}" font-size="13" font-weight="700" fill="#64748b">{{ n_unknown }} metric(s)</text>
{% endif %}

{# ── Bar chart ── #}
{% set chart_y = badge_y + badge_h + 16 %}
{% set bar_x = 180 %}
{% set bar_area_w = 360 %}

{# Table header row #}
<text x="36" y="{{ chart_y + 10 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">METRIC</text>
<text x="{{ bar_x }}" y="{{ chart_y + 10 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">VALUE</text>
<text x="{{ bar_x + bar_area_w + 16 }}" y="{{ chart_y + 10 }}" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">STATUS</text>
<line x1="36" y1="{{ chart_y + 16 }}" x2="680" y2="{{ chart_y + 16 }}" stroke="#cbd5e1" stroke-width="0.5"/>

{% for bar in bars %}
{% set by = chart_y + 22 + loop.index0 * row_h %}

{# Row separator #}
{% if not loop.first %}
<line x1="36" y1="{{ by - 4 }}" x2="680" y2="{{ by - 4 }}" stroke="#cbd5e1" stroke-width="0.25"/>
{% endif %}

{# Label #}
<text x="36" y="{{ by + 18 }}" font-size="10" font-weight="500" fill="#0f172a">{{ bar.label|truncate_text(22) }}</text>

{# Background track #}
<rect x="{{ bar_x }}" y="{{ by + 4 }}" width="{{ bar_area_w }}" height="22" rx="4" fill="#f8f9fb" stroke="#cbd5e1" stroke-width="0.25"/>

{# Value bar #}
{% set bw = bar.bar_w %}
<rect x="{{ bar_x }}" y="{{ by + 4 }}" width="{{ max(4, bw) }}" height="22" rx="4" fill="{{ bar.color }}" opacity="0.8"/>

{# Value text #}
<text x="{{ bar_x + max(4, bw) + 8 }}" y="{{ by + 20 }}" font-size="13" font-weight="700" fill="{{ bar.color }}">{{ bar.display_value }}</text>

{# Threshold marker #}
{% if bar.threshold_x %}
<line x1="{{ bar_x + bar.threshold_x }}" y1="{{ by + 2 }}" x2="{{ bar_x + bar.threshold_x }}" y2="{{ by + 28 }}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
{% endif %}

{# Status badge #}
<rect x="{{ bar_x + bar_area_w + 10 }}" y="{{ by + 4 }}" width="80" height="22" rx="11" fill="{{ bar.status_bg }}"/>
<text x="{{ bar_x + bar_area_w + 50 }}" y="{{ by + 19 }}" text-anchor="middle" font-size="9" font-weight="600" fill="{{ bar.status_color }}">{{ bar.status_icon }} {{ bar.status }}</text>
{% endfor %}

{# Threshold legend #}
{% set legend_y = chart_y + 22 + bars|length * row_h + 6 %}
<line x1="{{ bar_x }}" y1="{{ legend_y }}" x2="{{ bar_x + 20 }}" y2="{{ legend_y }}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="{{ bar_x + 26 }}" y="{{ legend_y + 4 }}" font-size="9" fill="#94a3b8">Fairness threshold</text>

{# ── Explanation panel ── #}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}
{% set _exp_lines = _exp.split('\n') %}
<rect x="36" y="{{ exp_y }}" width="644" height="{{ 44 + _exp_lines|length * 16 }}" rx="10" fill="#ffffff"/>
<rect x="56" y="{{ exp_y }}" width="604" height="0.5" fill="#475569"/>
<text x="56" y="{{ exp_y + 26 }}" font-size="11" font-weight="700" fill="#0f172a">Explanation</text>
{% for _line in _exp_lines %}
<text x="56" y="{{ exp_y + 50 + loop.index0 * 16 }}" font-size="9.5" fill="#6b7280">{{ _line }}</text>
{% endfor %}
{% endif %}

{# ── Bottom accent + icon ── #}
<rect x="36" y="{{ total_h - 14 }}" width="618" height="1.5" rx="0.75" fill="url(#accent)"/>
<use href="#validant-icon" x="658" y="{{ total_h - 25 }}" width="22" height="22" opacity="0.55"/>

</svg>
