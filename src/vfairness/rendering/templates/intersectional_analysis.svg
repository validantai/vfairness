{# ── Feature Engineering · Intersectional Analysis Heatmap SVG Template ── #}
{% set col_w = min(80, (440 / max(1, n_cols))|int) %}
{% set row_h = min(42, (280 / max(1, n_rows))|int) %}
{% set col_start = 180 %}
{% set row_start = 210 %}
{% set grid_h = n_rows * row_h %}
{% set scale_y = row_start + grid_h + 16 %}
{% set finding_y = scale_y + 40 %}
{% set exp_y = finding_y + 54 %}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
{% set exp_h = 44 + _exp_lines|length * 16 %}
{% else %}
{% set exp_h = 0 %}
{% endif %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}

{# ── COULD NOT CHECK (see the CRITICAL note in _could_not_check.svg) ──
   The MAX DISPARITY badge, the grid, the colour scale and the finding panel all
   go. max(cells) - min(cells) over an empty grid fell back to 0, and 0.000 in
   emerald beside "Between  and " is the canvas for perfect parity across every
   intersection, from a heatmap with no intersection on it. #}
{% if not_assessable %}
{% set _na_lines = (not_assessable_reason|default('', true)|wordwrap(88)).split('\n') %}
{% set na_h = 76 + _na_lines|length * 18 %}
{% set na_y = 134 %}
{% set exp_y = na_y + na_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}
{% endif %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 {{ total_h }}" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
{% include '_shared_defs.svg' %}

{# ── Background ── #}
<rect width="680" height="{{ total_h }}" fill="#f8f9fb"/>

{# ── Header ── #}
<rect width="680" height="52" fill="#ffffff"/>
<use href="#validant-logo" x="36" y="15" width="110" height="30"/>
{% if timestamp %}<text x="644" y="32" text-anchor="end" font-size="9" fill="#94a3b8">{{ timestamp }}</text>{% endif %}
<rect x="36" y="52" width="644" height="1.5" rx="0.75" fill="url(#accent)"/>

{# ── Title ── #}
<text x="36" y="96" font-size="18" font-weight="700" fill="#0f172a">{{ title }}</text>
{% if not_assessable %}
<text x="36" y="122" font-size="10" fill="#64748b">No intersection was analysed</text>
{% else %}
<text x="36" y="122" font-size="10" fill="#64748b">{{ subtitle }}</text>
{% endif %}

{% if not_assessable %}
{% include '_could_not_check.svg' %}
{% else %}

{# ── Stats Badges ── #}
{% set badge_y = 134 %}
<rect x="36" y="{{ badge_y }}" width="160" height="30" rx="8" fill="#ffffff"/>
<text x="56" y="{{ badge_y + 12 }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">FEATURE</text>
<text x="56" y="{{ badge_y + 24 }}" font-size="13" font-weight="700" fill="#0f172a">{{ feature_name|truncate_text(18) }}</text>

<rect x="208" y="{{ badge_y }}" width="180" height="30" rx="8" fill="#ffffff"/>
<text x="228" y="{{ badge_y + 12 }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MAX DISPARITY</text>
<text x="228" y="{{ badge_y + 24 }}" font-size="13" font-weight="700" fill="{{ max_color }}">{{ max_disparity|f3 }}</text>

{# The spread is taken over the POPULATED cells only, so the count of cells that
   reported nothing belongs beside it: without this pill a banded MAX DISPARITY
   reads as covering every intersection on the grid, including the blank ones. #}
{% if n_unmeasured %}
<rect x="400" y="{{ badge_y }}" width="200" height="30" rx="8" fill="#f1f5f9"/>
<text x="420" y="{{ badge_y + 12 }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">NOT MEASURED</text>
<text x="420" y="{{ badge_y + 24 }}" font-size="11" font-weight="700" fill="#64748b">{{ n_unmeasured }} of {{ n_cells }} cells, not graded</text>
{% endif %}

{# ── Heatmap Panel ── #}
<rect x="36" y="{{ row_start - 36 }}" width="644" height="{{ grid_h + 48 }}" rx="10" fill="#ffffff"/>

{# Axis labels #}
<text x="{{ col_start + (n_cols * col_w) // 2 }}" y="{{ row_start - 20 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">{{ x_attr }}</text>
<text x="50" y="{{ row_start + grid_h // 2 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a" transform="rotate(-90,50,{{ row_start + grid_h // 2 }})">{{ y_attr }}</text>

{# Column labels on top #}
{% for label in col_labels %}
{% set cx = col_start + loop.index0 * col_w + col_w // 2 %}
<text x="{{ cx }}" y="{{ row_start - 4 }}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">{{ label|upper }}</text>
{% endfor %}

{# Rows #}
{% for row in rows %}
{% set ry = row_start + loop.index0 * row_h %}

{# Row label on left #}
<text x="170" y="{{ ry + row_h // 2 + 2 }}" text-anchor="end" font-size="9.5" fill="#0f172a" font-weight="500">{{ row.label }}</text>

{# Cells: value (large) + n (small) #}
{% for cell in row.cells %}
{% set cell_x = col_start + loop.index0 * col_w %}
<rect x="{{ cell_x + 1 }}" y="{{ ry + 1 }}" width="{{ col_w - 2 }}" height="{{ row_h - 2 }}" rx="4" fill="{{ cell.bg }}"/>
{# An unpopulated cell prints N/A on slate (|f2 renders None as N/A), never a
   number on the outcome-rate scale: as 0.00 it took the darkest green on the
   grid, which is this chart's best-outcome colour. Its second line names the
   silence instead of showing "n=0", which reads as a measured empty stratum. #}
<text x="{{ cell_x + col_w // 2 }}" y="{{ ry + row_h // 2 - 1 }}" text-anchor="middle" font-size="11" font-weight="700" fill="{{ cell.text_color }}">{{ cell.value|f2 }}</text>
{% if cell.value is none and cell.n is none %}
<text x="{{ cell_x + col_w // 2 }}" y="{{ ry + row_h // 2 + 12 }}" text-anchor="middle" font-size="7" fill="{{ cell.sub_color }}">not measured</text>
{% else %}
<text x="{{ cell_x + col_w // 2 }}" y="{{ ry + row_h // 2 + 12 }}" text-anchor="middle" font-size="7" fill="{{ cell.sub_color }}">n={{ cell.n }}</text>
{% endif %}
{% endfor %}
{% endfor %}

{# ── Colour Scale ── #}
<text x="170" y="{{ scale_y + 11 }}" text-anchor="end" font-size="9" fill="#6b7280">Low</text>
{% set scale_colors = ['#ecfdf5', '#d1fae5', '#a7f3d0', '#fef9c3', '#fde68a', '#fed7aa', '#fca5a5', '#fecaca'] %}
{% for sc in scale_colors %}
<rect x="{{ 180 + loop.index0 * 36 }}" y="{{ scale_y }}" width="36" height="12" rx="2" fill="{{ sc }}"/>
{% endfor %}
<text x="{{ 180 + scale_colors|length * 36 + 8 }}" y="{{ scale_y + 11 }}" font-size="9" fill="#6b7280">High</text>

{# ── Disparity Finding Panel ── #}
<rect x="36" y="{{ finding_y }}" width="644" height="44" rx="10" fill="#ffffff"/>
<text x="56" y="{{ finding_y + 18 }}" font-size="9.5" fill="#6b7280">Max intersectional disparity:</text>
<text x="240" y="{{ finding_y + 18 }}" font-size="13" font-weight="700" fill="{{ max_color }}">{{ max_disparity|f3 }}</text>
<text x="56" y="{{ finding_y + 36 }}" font-size="9.5" fill="#6b7280">Between <tspan font-weight="600" fill="#0f172a">{{ max_group_1 }}</tspan> and <tspan font-weight="600" fill="#0f172a">{{ max_group_2 }}</tspan></text>
{% endif %}{# end: not not_assessable #}

{# ── Explanation Panel ── #}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
<rect x="36" y="{{ exp_y }}" width="644" height="{{ 44 + _exp_lines|length * 16 }}" rx="10" fill="#ffffff"/>
<rect x="56" y="{{ exp_y }}" width="604" height="0.5" fill="#475569"/>
<text x="56" y="{{ exp_y + 26 }}" font-size="11" font-weight="700" fill="#0f172a">Explanation</text>
{% for _line in _exp_lines %}<text x="56" y="{{ exp_y + 50 + loop.index0 * 16 }}" font-size="9.5" fill="#6b7280">{{ _line }}</text>{% endfor %}
{% endif %}

{# ── Bottom accent + icon ── #}
<rect x="36" y="{{ total_h - 14 }}" width="618" height="1.5" rx="0.75" fill="url(#accent)"/>
<use href="#validant-icon" x="658" y="{{ total_h - 25 }}" width="22" height="22" opacity="0.55"/>
</svg>
