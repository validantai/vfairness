{# ── Feature Engineering · Proxy Risk Assessment SVG Template ── #}
{% set max_features = 8 %}
{% set n_rated = features[:max_features]|length %}
{% set n_rows = n_table_rows|default(n_rated, true) %}
{% set row_h = min(44, (320 / max(1, n_rows))|int) %}
{% set table_y = 180 %}
{% set table_h = 30 + n_rows * row_h %}
{% set exp_y = table_y + table_h + 20 %}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
{% set exp_h = 44 + _exp_lines|length * 16 %}
{% else %}
{% set exp_h = 0 %}
{% endif %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}

{# ── COULD NOT CHECK (see the CRITICAL note in _could_not_check.svg) ──
   The risk-count badges and the ranked table go. With no feature rated, the
   badge row renders empty and the table renders as bare column headings, and an
   empty proxy-risk table is read as "no feature carries proxy risk", which is
   the strongest all-clear this chart can give. Nothing was examined. #}
{% if not_assessable %}
{% set _na_lines = (not_assessable_reason|default('', true)|wordwrap(88)).split('\n') %}
{% set na_h = 76 + _na_lines|length * 18 %}
{% set na_y = 134 %}
{% set exp_y = na_y + na_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}
{% endif %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 {{ total_h }}" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
{% include '_shared_defs.svg' %}

{# ── Background ── #}
<rect width="680" height="{{ total_h }}" fill="#f8f9fb"/>

{# ── Header ── #}
<rect width="680" height="52" fill="#ffffff"/>
<use href="#validant-logo" x="36" y="15" width="110" height="30"/>
{% if timestamp %}<text x="644" y="32" text-anchor="end" font-size="9" fill="#94a3b8">{{ timestamp }}</text>{% endif %}
<rect x="36" y="52" width="644" height="1.5" rx="0.75" fill="url(#accent)"/>

{# ── Title ── #}
<text x="36" y="96" font-size="18" font-weight="700" fill="#0f172a">{{ title }}</text>
{% if not_assessable %}
<text x="36" y="122" font-size="10" fill="#64748b">No feature was ranked for proxy risk</text>
{% else %}
<text x="36" y="122" font-size="10" fill="#64748b">{{ subtitle }}</text>
{% endif %}

{% if not_assessable %}
{% include '_could_not_check.svg' %}
{% else %}

{# ── Risk Count Badges ──
   CRITICAL: each badge's x comes from the adapter. This loop used to advance a
   local `badge_x`, and a Jinja assignment does not survive the iteration that
   made it, so every badge was drawn at x=36 and the LAST one painted covered
   the rest: a scan holding one CRITICAL and two LOW findings showed a single
   emerald "LOW: 2" pill, while the markup underneath carried "CRITICAL: 1" and
   satisfied every substring test. Do not reintroduce a set-counter here. #}
{% set badge_y = 134 %}
{% for level in risk_counts %}
<rect x="{{ level.x }}" y="{{ badge_y }}" width="{{ level.width }}" height="30" rx="8" fill="{{ level.bg }}"/>
<text x="{{ level.x + level.width // 2 }}" y="{{ badge_y + 19 }}" text-anchor="middle" font-size="10" font-weight="600" fill="{{ level.color }}">{{ level.label }}: {{ level.count }}</text>
{% endfor %}

{# ── Table Panel ── #}
<rect x="36" y="{{ table_y }}" width="644" height="{{ table_h }}" rx="10" fill="#ffffff"/>

{# Table Header #}
{% set hdr_y = table_y + 18 %}
<text x="56" y="{{ hdr_y }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">FEATURE</text>
<text x="180" y="{{ hdr_y }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">PROTECTED ATTR</text>
<text x="310" y="{{ hdr_y }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CORRELATION</text>
<text x="510" y="{{ hdr_y }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CONFIDENCE</text>
<text x="620" y="{{ hdr_y }}" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">RISK</text>
<line x1="56" y1="{{ hdr_y + 6 }}" x2="660" y2="{{ hdr_y + 6 }}" stroke="#cbd5e1" stroke-width="0.5"/>

{# Table Rows #}
{% set bar_max_w = 160 %}
{% set conf_bar_max = 80 %}
{% for feat in features[:max_features] %}
{% set fy = table_y + 30 + loop.index0 * row_h %}

{# Separator line #}
{% if not loop.first %}
<line x1="56" y1="{{ fy }}" x2="660" y2="{{ fy }}" stroke="#cbd5e1" stroke-width="0.3"/>
{% endif %}

{# Feature name #}
<text x="56" y="{{ fy + row_h // 2 + 2 }}" font-size="10" fill="#0f172a" font-weight="500">{{ feat.name|truncate_text(18) }}</text>

{# Protected attribute tag #}
<rect x="180" y="{{ fy + row_h // 2 - 8 }}" width="{{ min(110, feat.protected_attr|length * 6 + 14) }}" height="16" rx="8" fill="#e0e7ff"/>
<text x="188" y="{{ fy + row_h // 2 + 3 }}" font-size="8" fill="#4338ca">{{ feat.protected_attr|truncate_text(14) }}</text>

{# Correlation bar. A candidate whose correlation was never computed gets the
   empty track and the words, never a bar: at r=0.00 the old default drew a
   short EMERALD bar, the far end of the proxy-strength scale, which says the
   feature was measured and is not a stand-in for the protected attribute. #}
<rect x="310" y="{{ fy + row_h // 2 - 5 }}" width="{{ bar_max_w }}" height="10" rx="4" fill="#f1f5f9"/>
{% if feat.correlation is not none %}
{% set corr_w = min(bar_max_w, max(4, (feat.correlation * bar_max_w)|int)) %}
<rect x="310" y="{{ fy + row_h // 2 - 5 }}" width="{{ corr_w }}" height="10" rx="4" fill="{{ feat.corr_color }}" opacity="0.8"/>
<text x="{{ 310 + corr_w + 6 }}" y="{{ fy + row_h // 2 + 3 }}" font-size="8.5" font-weight="600" fill="{{ feat.corr_color }}">r={{ feat.raw_correlation|f2 }}</text>
{% else %}
<text x="316" y="{{ fy + row_h // 2 + 3 }}" font-size="8.5" font-weight="600" fill="#94a3b8">r not computed</text>
{% endif %}

{# Confidence bar. Same rule: the 0.5 default drew a half-full bar for a
   confidence nobody reported. #}
<rect x="510" y="{{ fy + row_h // 2 - 5 }}" width="{{ conf_bar_max }}" height="10" rx="4" fill="#f1f5f9"/>
{% if feat.confidence is not none %}
{% set conf_w = min(conf_bar_max, max(4, (feat.confidence * conf_bar_max)|int)) %}
<rect x="510" y="{{ fy + row_h // 2 - 5 }}" width="{{ conf_w }}" height="10" rx="4" fill="{{ feat.conf_color }}" opacity="0.6"/>
{% else %}
<text x="516" y="{{ fy + row_h // 2 + 3 }}" font-size="8" fill="#94a3b8">not reported</text>
{% endif %}

{# Risk level badge #}
<rect x="610" y="{{ fy + row_h // 2 - 10 }}" width="56" height="20" rx="10" fill="{{ feat.risk_bg }}"/>
<text x="638" y="{{ fy + row_h // 2 + 3 }}" text-anchor="middle" font-size="8" font-weight="700" fill="{{ feat.risk_color }}">{{ feat.risk_level }}</text>
{% endfor %}

{# ── Candidates that carried no risk level ──
   They stay on the table so the reader can see the scan looked at them, drawn
   in slate with no bar and no badge colour. They are counted in the NOT RATED
   pill above and in no other count: an unrated candidate that borrowed the LOW
   style was the strongest all-clear this chart can give, issued for a feature
   nobody scored. #}
{% for feat in unrated_features %}
{% set fy = table_y + 30 + (n_rated + loop.index0) * row_h %}
{% if n_rated or not loop.first %}
<line x1="56" y1="{{ fy }}" x2="660" y2="{{ fy }}" stroke="#cbd5e1" stroke-width="0.3"/>
{% endif %}
<text x="56" y="{{ fy + row_h // 2 + 2 }}" font-size="10" fill="#64748b" font-weight="500">{{ feat.name|truncate_text(18) }}</text>
{% if feat.protected_attr %}
<rect x="180" y="{{ fy + row_h // 2 - 8 }}" width="{{ min(110, feat.protected_attr|length * 6 + 14) }}" height="16" rx="8" fill="#f1f5f9"/>
<text x="188" y="{{ fy + row_h // 2 + 3 }}" font-size="8" fill="#94a3b8">{{ feat.protected_attr|truncate_text(14) }}</text>
{% endif %}
<rect x="310" y="{{ fy + row_h // 2 - 5 }}" width="{{ bar_max_w }}" height="10" rx="4" fill="#f1f5f9"/>
<text x="316" y="{{ fy + row_h // 2 + 3 }}" font-size="8.5" font-weight="600" fill="#94a3b8">not rated for proxy risk</text>
<rect x="510" y="{{ fy + row_h // 2 - 5 }}" width="{{ conf_bar_max }}" height="10" rx="4" fill="#f1f5f9"/>
<rect x="604" y="{{ fy + row_h // 2 - 10 }}" width="68" height="20" rx="10" fill="#f1f5f9"/>
<text x="638" y="{{ fy + row_h // 2 + 3 }}" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">NOT RATED</text>
{% endfor %}
{% endif %}{# end: not not_assessable #}

{# ── Explanation Panel ── #}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
<rect x="36" y="{{ exp_y }}" width="644" height="{{ 44 + _exp_lines|length * 16 }}" rx="10" fill="#ffffff"/>
<rect x="56" y="{{ exp_y }}" width="604" height="0.5" fill="#475569"/>
<text x="56" y="{{ exp_y + 26 }}" font-size="11" font-weight="700" fill="#0f172a">Explanation</text>
{% for _line in _exp_lines %}<text x="56" y="{{ exp_y + 50 + loop.index0 * 16 }}" font-size="9.5" fill="#6b7280">{{ _line }}</text>{% endfor %}
{% endif %}

{# ── Bottom accent + icon ── #}
<rect x="36" y="{{ total_h - 14 }}" width="618" height="1.5" rx="0.75" fill="url(#accent)"/>
<use href="#validant-icon" x="658" y="{{ total_h - 25 }}" width="22" height="22" opacity="0.55"/>
</svg>
