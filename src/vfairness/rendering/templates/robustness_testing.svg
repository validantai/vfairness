{# ── Robustness Testing Dashboard SVG Template ── #}
{# ── vfairness Design System v4 · 680-width layout ── #}

{# ── Height computation ── #}
{% set header_h = 140 %}
{% set score_h = 70 %}
{% set perm_header_h = 34 %}
{% set perm_row_h = 36 %}
{% set perm_h = perm_header_h + perm_tests|length * perm_row_h + 10 %}
{% set sens_row_h = 40 %}
{% set sens_h = 34 + sens_bars|length * sens_row_h + 10 %}
{% set sg_h = 0 %}
{% if subgroup and subgroup.reported %}
{% set sg_h = 70 + flagged|length * 30 + 10 %}
{% endif %}
{% set rec_h = 34 + recommendations|length * 18 + 10 %}
{% set exp_h = 0 %}
{% if explanation %}
{% set _exp_pre = explanation|wordwrap(105) %}
{% set _exp_lines_pre = _exp_pre.split('\n') %}
{% set exp_h = 40 + _exp_lines_pre|length * 16 + 24 %}
{% endif %}

{% set score_y = header_h %}
{% set perm_y = score_y + score_h + 16 %}
{# The gap belongs to the panel above it: a dropped panel must not leave its   #}
{# 16px behind. With every panel present these three lines compute exactly the #}
{# offsets they always did. #}
{% set sens_y = perm_y + perm_h + (16 if perm_h else 0) %}
{% set sg_y = sens_y + sens_h + (16 if sens_h else 0) %}
{% set rec_y = sg_y + sg_h + (16 if sg_h else 0) %}
{% set exp_y = rec_y + rec_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}

{# ══════════════════════════════════════════════════════════════════ #}
{# COULD NOT CHECK                                                   #}
{# CRITICAL: three states, never two. A dashboard handed no test must not     #}
{# print a verdict, a score or a status colour. Until 2026-08-27              #}
{# robustness_testing_to_svg(None) fell back to a module-level demo fixture   #}
{# and rendered ROBUST at 0.72 with three named p-values, while               #}
{# robustness_testing_to_svg([], [], None) rendered a banded MARGINAL with    #}
{# "score: 0.50" over the line "0 permutation tests · 0 sensitivity checks ·  #}
{# 0 subgroups" and a Recommendations panel reading "All robustness checks    #}
{# passed". The 0.50 was a neutral SENTINEL, not a measurement. This branch   #}
{# collapses the whole stack (tests, sensitivity, subgroups, recommendations) #}
{# to one panel that states the absence. #}
{% set notice_h = 96 %}
{% if nothing_tested %}
{% set notice_y = header_h %}
{% set exp_y = notice_y + notice_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}
{% elif not score_known %}
{# Only a subgroup audit was supplied. The permutation and sensitivity panels
   would render as empty table shells, column headings and all, under a headline
   that already says NOT SCORED, so they are dropped and the audit moves up. A
   run that DID score keeps today's layout exactly, empty shell included.

   An EMPTY panel is dropped; a panel with rows is kept even though the run is
   not scored. A permutation test that reported no p-value is ungraded, not
   absent: it was supplied, the reader has to see it and see that it was not
   graded, so its row stays on the canvas with the NOT CHECKED status below. #}
{% if not perm_tests %}{% set perm_h = 0 %}{% endif %}
{% if not sens_bars %}{% set sens_h = 0 %}{% endif %}
{% set sens_y = perm_y + perm_h + (16 if perm_h else 0) %}
{% set sg_y = sens_y + sens_h + (16 if sens_h else 0) %}
{% set rec_y = sg_y + sg_h + (16 if sg_h else 0) %}
{% set exp_y = rec_y + rec_h + 16 %}
{% set total_h = (exp_y + exp_h + 30) if explanation else (exp_y + 14) %}
{% endif %}
<svg xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif" viewBox="0 0 680 {{ total_h }}">
{% include '_shared_defs.svg' %}

{# ── Background ── #}
<rect width="680" height="{{ total_h }}" fill="#f8f9fb"/>

{# ── Header bar ── #}
<rect width="680" height="52" fill="#ffffff"/>
<use href="#validant-logo" x="36" y="15" width="110" height="30"/>
{% if timestamp %}<text x="644" y="32" text-anchor="end" font-size="9" fill="#94a3b8">{{ timestamp }}</text>{% endif %}
<rect x="36" y="52" width="644" height="1.5" rx="0.75" fill="url(#accent)"/>

{# ── EXAMPLE band ── #}
{# The demo fixture is reachable only through example=True, and when it is used #}
{# the canvas has to say so where a reader looks, not only in the <desc>. DO    #}
{# NOT REMOVE: the band is the only thing separating a sample from an audit     #}
{# artifact once the SVG is exported. #}
{% if is_example %}
<rect x="0" y="54" width="680" height="20" fill="#fef3c7"/>
<text x="340" y="68" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e" letter-spacing="0.8">EXAMPLE ONLY: SYNTHETIC DEMONSTRATION DATA, NOT A REAL EVALUATION</text>
{% endif %}
{# ── Title ── #}
<text x="36" y="96" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.3">{{ title }}</text>
{% if nothing_tested %}
<text x="36" y="122" font-size="10" fill="#64748b">Nothing was tested: no permutation test, no sensitivity check, no subgroup audit</text>
{% else %}
{# The permutation count is a count of tests SUPPLIED, and a count reads as a  #}
{# measurement, so the ungraded ones are named right here rather than left for #}
{# the reader to assume. #}
{# `|default(0)` substitutes for an UNDEFINED key only, never for a reported    #}
{# None, so an audit that withheld its subgroup count printed the literal word #}
{# "None subgroups" here. And `default(0)` itself was the same defect one step  #}
{# further on: "0 subgroups" is what a run with no audit at all prints, so an   #}
{# audit that reported findings and no denominator was summarised as an audit   #}
{# that examined nobody. #}
<text x="36" y="122" font-size="10" fill="#64748b">{{ perm_tests|length }} permutation tests{% if n_perm_ungraded %} ({{ n_perm_ungraded }} not graded){% endif %} · {{ sens_bars|length }} sensitivity checks{% if n_sens_ungraded %} ({{ n_sens_ungraded }} not graded){% endif %} · {% if subgroup and subgroup.reported and subgroup.n_analyzed is none %}subgroup count not reported{% else %}{{ subgroup.n_analyzed|default(0, true) }} subgroups{% endif %}</text>
{% endif %}

{# ── Overall Robustness Score ── #}
{# Three states, never two: the score box grades only when a permutation test or #}
{# a sensitivity check was supplied to compute a score FROM. See the CRITICAL    #}
{# note at the top of this file: the amber MARGINAL band was being painted over  #}
{# a 0.50 sentinel. #}
<rect x="520" y="68" width="160" height="56" rx="10" fill="#ffffff"/>
<rect x="520" y="68" width="2.5" height="56" rx="1" fill="{{ overall_color }}"/>
<text x="536" y="84" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ROBUSTNESS</text>
{% if score_known %}
<text x="536" y="108" font-size="20" font-weight="700" fill="{{ overall_color }}">{{ overall_label }}</text>
<text x="536" y="120" font-size="9" fill="#94a3b8">score: <tspan font-weight="700" fill="{{ overall_color }}">{{ overall_score|f2 }}</tspan></text>
{% else %}
<text x="536" y="106" font-size="13" font-weight="700" fill="{{ overall_color }}">NOT SCORED</text>
<text x="536" y="119" font-size="8" fill="#94a3b8">no scored test was supplied</text>
{% endif %}
{% if nothing_tested %}
{# ══════════════════════════════════════════════════════════════════ #}
{# NOTHING WAS TESTED PANEL  (see the CRITICAL note above)           #}
{# ══════════════════════════════════════════════════════════════════ #}
<rect x="36" y="{{ notice_y }}" width="644" height="{{ notice_h }}" rx="10" fill="#ffffff"/>
<rect x="36" y="{{ notice_y }}" width="2.5" height="{{ notice_h }}" rx="1" fill="#64748b"/>
<rect x="520" y="{{ notice_y + 20 }}" width="140" height="28" rx="14" fill="#f1f5f9"/>
<text x="590" y="{{ notice_y + 39 }}" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">NOT CHECKED</text>
<text x="56" y="{{ notice_y + 32 }}" font-size="15" font-weight="700" fill="#64748b">Nothing was tested</text>
<text x="56" y="{{ notice_y + 56 }}" font-size="10.5" fill="#64748b">No permutation test, sensitivity check or subgroup audit was supplied, so no</text>
<text x="56" y="{{ notice_y + 74 }}" font-size="10.5" fill="#64748b">robustness score was computed. This is not a pass and it is not a failure.</text>
{% else %}
{% if score_known or perm_tests %}

{# ══════════════════════════════════════════════════════════════════ #}
{# Permutation Tests Table                                          #}
{# ══════════════════════════════════════════════════════════════════ #}
<rect x="36" y="{{ perm_y }}" width="644" height="{{ perm_h }}" rx="10" fill="#ffffff"/>
<text x="56" y="{{ perm_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">METHOD</text>
<text x="260" y="{{ perm_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">OBSERVED</text>
<text x="370" y="{{ perm_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">P-VALUE</text>
<text x="470" y="{{ perm_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">DIRECTION</text>
<text x="600" y="{{ perm_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">STATUS</text>
<line x1="56" y1="{{ perm_y + 30 }}" x2="660" y2="{{ perm_y + 30 }}" stroke="#475569" stroke-width="0.75"/>

{% for p in perm_tests %}
{% set ry = perm_y + perm_header_h + loop.index0 * perm_row_h %}
{% if p.significant %}
<rect x="36" y="{{ ry }}" width="644" height="{{ perm_row_h }}" fill="#fef2f2" opacity="0.3"/>
<rect x="36" y="{{ ry }}" width="2.5" height="{{ perm_row_h }}" fill="#dc2626"/>
{% endif %}
<text x="56" y="{{ ry + 22 }}" font-size="10.5" font-weight="500" fill="#0f172a">{{ p.method }}</text>
{# CRITICAL, per row: no number, no colour and no badge for a test that        #}
{# reported nothing. The p-value cell used to print a DEFAULTED 1.0000 beside  #}
{# a green STABLE badge, which is the most reassuring reading this table can   #}
{# produce, from a row that measured nothing. A sentinel is not a measurement. #}
{% if p.observed is not none %}
<text x="260" y="{{ ry + 22 }}" font-size="10" font-weight="500" fill="#475569">{{ p.observed|f3 }}</text>
{% else %}
<text x="260" y="{{ ry + 22 }}" font-size="9" font-style="italic" fill="#64748b">not reported</text>
{% endif %}
{% if p.p_value is not none %}
<text x="370" y="{{ ry + 22 }}" font-size="10" font-weight="500" fill="{{ '#dc2626' if p.p_value < 0.05 else '#475569' }}">{{ p.p_value|f4 }}</text>
{% else %}
<text x="370" y="{{ ry + 22 }}" font-size="9" font-style="italic" fill="#64748b">not reported</text>
{% endif %}
<text x="470" y="{{ ry + 22 }}" font-size="10" fill="#64748b">{{ p.direction }}</text>
{% if not p.graded %}
<rect x="586" y="{{ ry + 6 }}" width="72" height="20" rx="10" fill="#f1f5f9"/>
<text x="622" y="{{ ry + 20 }}" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748b">NOT CHECKED</text>
{% elif p.significant %}
<rect x="586" y="{{ ry + 6 }}" width="72" height="20" rx="10" fill="#fef2f2"/>
<text x="622" y="{{ ry + 20 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">SIGNIF.</text>
{% else %}
<rect x="586" y="{{ ry + 6 }}" width="72" height="20" rx="10" fill="#ecfdf5"/>
<text x="622" y="{{ ry + 20 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">STABLE</text>
{% endif %}
{% if not loop.last %}
<line x1="56" y1="{{ ry + perm_row_h }}" x2="660" y2="{{ ry + perm_row_h }}" stroke="#cbd5e1" stroke-width="0.5"/>
{% endif %}
{% endfor %}
{% endif %}

{# ══════════════════════════════════════════════════════════════════ #}
{# Sensitivity Bars                                                 #}
{# ══════════════════════════════════════════════════════════════════ #}
{% if score_known or sens_bars %}
<rect x="36" y="{{ sens_y }}" width="644" height="{{ sens_h }}" rx="10" fill="#ffffff"/>
<text x="56" y="{{ sens_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">PERTURBATION TYPE</text>
<text x="300" y="{{ sens_y + 22 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">ROBUSTNESS SCORE</text>
<line x1="56" y1="{{ sens_y + 30 }}" x2="660" y2="{{ sens_y + 30 }}" stroke="#475569" stroke-width="0.75"/>

{% for s in sens_bars %}
{% set ry = sens_y + 34 + loop.index0 * sens_row_h %}
<text x="56" y="{{ ry + 16 }}" font-size="10.5" font-weight="500" fill="#0f172a">{{ s.type }}</text>
{# CRITICAL, per row: no number, no bar, no colour and no badge for a check     #}
{# that reported nothing. The score cell used to print a DEFAULTED 0.00 beside  #}
{# a red WEAK badge, which is the most alarming reading this table can produce, #}
{# from a row that measured nothing, and that invented weakness then dragged    #}
{# the ROBUSTNESS headline down with it. A sentinel is not a measurement, and a #}
{# fabricated breach is as wrong as a fabricated all-clear. #}
{% if s.max_deviation is not none %}
<text x="56" y="{{ ry + 30 }}" font-size="8" fill="#94a3b8">max dev: {{ s.max_deviation|f3 }}</text>
{% else %}
<text x="56" y="{{ ry + 30 }}" font-size="8" font-style="italic" fill="#94a3b8">max dev: not reported</text>
{% endif %}
<rect x="300" y="{{ ry + 6 }}" width="200" height="12" rx="4" fill="#f1f5f9"/>
{% if s.measured %}
<rect x="300" y="{{ ry + 6 }}" width="{{ s.bar_w }}" height="12" rx="4" fill="{{ s.color }}" opacity="0.7"/>
<text x="510" y="{{ ry + 16 }}" font-size="10" font-weight="600" fill="{{ s.color }}">{{ s.score|f2 }}</text>
{% else %}
<text x="510" y="{{ ry + 16 }}" font-size="8" font-style="italic" fill="#64748b">no score</text>
{% endif %}
{% if not s.graded %}
<rect x="554" y="{{ ry + 4 }}" width="72" height="18" rx="9" fill="#f1f5f9"/>
<text x="590" y="{{ ry + 16 }}" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748b">NOT CHECKED</text>
{% elif s.is_robust %}
<rect x="560" y="{{ ry + 4 }}" width="60" height="18" rx="9" fill="#ecfdf5"/>
<text x="590" y="{{ ry + 16 }}" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">ROBUST</text>
{% else %}
<rect x="560" y="{{ ry + 4 }}" width="60" height="18" rx="9" fill="#fef2f2"/>
<text x="590" y="{{ ry + 16 }}" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">WEAK</text>
{% endif %}
{% if not loop.last %}
<line x1="56" y1="{{ ry + sens_row_h }}" x2="660" y2="{{ ry + sens_row_h }}" stroke="#cbd5e1" stroke-width="0.5"/>
{% endif %}
{% endfor %}
{% endif %}

{# ══════════════════════════════════════════════════════════════════ #}
{# Subgroup Audit                                                   #}
{# ══════════════════════════════════════════════════════════════════ #}
{% if subgroup and subgroup.reported %}
<rect x="36" y="{{ sg_y }}" width="644" height="{{ sg_h }}" rx="10" fill="#ffffff"/>
<text x="56" y="{{ sg_y + 22 }}" font-size="11" font-weight="700" fill="#0f172a">Subgroup Audit</text>
{# CRITICAL, per row: "0 flagged" and "(0.000)" are the exact cells a genuinely #}
{# clean audit prints, and they used to come from .get defaults, so an audit    #}
{# reporting only its subgroup COUNT certified every one of those subgroups as  #}
{# clear. A default is not a measurement. Each clause is drawn only when the    #}
{# audit reported it, and says so in words when it did not. #}
<text x="56" y="{{ sg_y + 38 }}" font-size="9" fill="#64748b">{% if subgroup.n_analyzed is not none %}{{ subgroup.n_analyzed }} analysed{% else %}subgroup count not reported{% endif %} · {% if subgroup.n_flagged is not none %}{{ subgroup.n_flagged }} flagged{% else %}flagged count not reported{% endif %} · {% if subgroup.worst_disparity is not none %}worst: {{ subgroup.worst_subgroup|default('n/a', true) }} ({{ subgroup.worst_disparity|f3 }}){% else %}worst disparity not reported{% endif %}</text>
{% if subgroup.gerrymandering %}
<rect x="480" y="{{ sg_y + 10 }}" width="180" height="22" rx="11" fill="#fef2f2"/>
<text x="570" y="{{ sg_y + 25 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">GERRYMANDERING RISK</text>
{% elif subgroup.gerrymandering is none %}
{# The ABSENCE of the red chip reads as "checked and clear", so an audit that  #}
{# never ran the check has to say so rather than inherit that reading. Slate,  #}
{# never green: this is neither a pass nor a finding. #}
<rect x="480" y="{{ sg_y + 10 }}" width="180" height="22" rx="11" fill="#f1f5f9"/>
<text x="570" y="{{ sg_y + 25 }}" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">GERRYMANDERING NOT CHECKED</text>
{% endif %}

<line x1="56" y1="{{ sg_y + 48 }}" x2="660" y2="{{ sg_y + 48 }}" stroke="#475569" stroke-width="0.75"/>
<text x="56" y="{{ sg_y + 62 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">FLAGGED SUBGROUP</text>
<text x="500" y="{{ sg_y + 62 }}" font-size="7.5" fill="#94a3b8" letter-spacing="0.8" font-weight="600">DISPARITY</text>
{% for f in flagged %}
{% set fy = sg_y + 70 + loop.index0 * 30 %}
<rect x="36" y="{{ fy }}" width="644" height="30" fill="#fef2f2" opacity="0.2"/>
<rect x="36" y="{{ fy }}" width="2.5" height="30" fill="#dc2626"/>
<text x="56" y="{{ fy + 18 }}" font-size="10" font-weight="500" fill="#0f172a">{{ f.name }}</text>
<text x="500" y="{{ fy + 18 }}" font-size="10" font-weight="600" fill="#dc2626">{{ f.disparity|f3 }}</text>
{% endfor %}
{% endif %}

{# ══════════════════════════════════════════════════════════════════ #}
{# Recommendations                                                  #}
{# ══════════════════════════════════════════════════════════════════ #}
<rect x="36" y="{{ rec_y }}" width="644" height="{{ rec_h }}" rx="10" fill="#ffffff"/>
<text x="56" y="{{ rec_y + 22 }}" font-size="11" font-weight="700" fill="#0f172a">Recommendations</text>
{% for r in recommendations %}
<text x="56" y="{{ rec_y + 42 + loop.index0 * 18 }}" font-size="9.5" fill="#6b7280">{{ loop.index }}. {{ r }}</text>
{% endfor %}
{% endif %}

{# ══════════════════════════════════════════════════════════════════ #}
{# Explanation Panel                                                 #}
{# ══════════════════════════════════════════════════════════════════ #}
{% if explanation %}
{% set _exp = explanation|wordwrap(105) %}{% set _exp_lines = _exp.split('\n') %}
<rect x="36" y="{{ exp_y }}" width="644" height="{{ 44 + _exp_lines|length * 16 }}" rx="10" fill="#ffffff"/>
<rect x="56" y="{{ exp_y }}" width="604" height="0.5" fill="#475569"/>
<text x="56" y="{{ exp_y + 26 }}" font-size="11" font-weight="700" fill="#0f172a">Explanation</text>
{% for _line in _exp_lines %}<text x="56" y="{{ exp_y + 50 + loop.index0 * 16 }}" font-size="9.5" fill="#6b7280">{{ _line }}</text>{% endfor %}
{% endif %}

{# ── Bottom accent + icon ── #}
<rect x="36" y="{{ total_h - 14 }}" width="618" height="1.5" rx="0.75" fill="url(#accent)"/>
<use href="#validant-icon" x="658" y="{{ total_h - 25 }}" width="22" height="22" opacity="0.55"/>
</svg>
