<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Plus Jakarta Sans, 'Segoe UI', system-ui, sans-serif">
  <!-- vfairness hero, Blanco technical-drawing standard.
       Palette: graphite #2e4057, slate #4e6078, muted #5a6a78, border #cdd4da,
       warm bg #fcfbfa, pass #41ba1b / text #1c6d00, warn/terracotta #b6573a.
       An ILLUSTRATIVE equivalence-test view: each metric is a non-negative
       between-group disparity (0 = parity), and its 95% interval is compared to
       a chosen tolerance band. The verdict is the EVIDENCE state, not a social
       judgement: within tolerance / exceeds tolerance / inconclusive.
       Colour is reserved for those three states; everything else is monochrome. -->

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e9e8e7" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="440" fill="#fcfbfa"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" fill="none" stroke="#cdd4da" stroke-width="1"/>

  <!-- technical-drawing corner registration marks -->
  <g stroke="#2e4057" stroke-width="1.4" fill="none">
    <path d="M 18 40 V 18 H 40"/>
    <path d="M 1160 18 H 1182 V 40"/>
    <path d="M 1182 400 V 422 H 1160"/>
    <path d="M 40 422 H 18 V 400"/>
  </g>

  <!-- ── left: wordmark + tagline ─────────────────────────────────────── -->
  <text x="64" y="150" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#2e4057">vfairness</text>
  <rect x="66" y="176" width="132" height="4" fill="#b6573a"/>
  <text x="66" y="222" font-size="21" font-weight="600" fill="#4e6078">Measure, prove, and explain</text>
  <text x="66" y="250" font-size="21" font-weight="600" fill="#4e6078">machine-learning fairness.</text>
  <text x="66" y="300" font-size="14.5" font-weight="500" fill="#5a6a78">Every result carries a confidence interval</text>
  <text x="66" y="322" font-size="14.5" font-weight="500" fill="#5a6a78">and an honest three-state outcome.</text>

  <g font-size="11" font-weight="700" letter-spacing="1" fill="#5a6a78">
    <text x="66" y="378">PYTHON 3.11+</text>
    <text x="172" y="378">·</text>
    <text x="186" y="378">APACHE-2.0</text>
    <text x="278" y="378">·</text>
    <text x="292" y="378">SELF-CONTAINED SVG</text>
  </g>

  <!-- vertical divider -->
  <line x1="470" y1="52" x2="470" y2="388" stroke="#cdd4da" stroke-width="1"/>

  <!-- ── right: fairness-evidence measurement drawing ─────────────────── -->
  <text x="510" y="66" font-size="12" font-weight="700" letter-spacing="2.5" fill="#5a6a78">FAIRNESS EVIDENCE</text>
  <text x="1150" y="66" font-size="11" font-weight="600" letter-spacing="1.5" fill="#5a6a78" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace">ILLUSTRATIVE</text>

  <!-- axis geometry: value 0.00 at x=545, 0.30 at x=975  (x = 545 + value*1433.33) -->
  <!-- tolerance band: value 0..0.10  ->  x 545..688 -->
  <rect x="545" y="100" width="143" height="250" fill="#41ba1b" fill-opacity="0.06"/>
  <text x="550" y="120" font-size="10" font-weight="700" letter-spacing="0.5" fill="#1c6d00">TOLERANCE BAND</text>

  <!-- tolerance line (dashed) at value 0.10 -> x=688 -->
  <line x1="688" y1="100" x2="688" y2="356" stroke="#2e4057" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="688" y="90" font-size="11" font-weight="700" letter-spacing="0.5" fill="#2e4057" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace">tolerance &#916; = 0.10</text>

  <!-- ── metric rows: label · disparity interval · evidence state ─────── -->
  <!-- row 1: equal opportunity  illustrative: whole CI inside the band -> WITHIN TOLERANCE -->
  <text x="510" y="150" font-size="15" font-weight="600" fill="#2e4057">Equal opportunity</text>
  <line x1="559" y1="172" x2="645" y2="172" stroke="#41ba1b" stroke-width="2.2"/>
  <line x1="559" y1="164" x2="559" y2="180" stroke="#41ba1b" stroke-width="2.2"/>
  <line x1="645" y1="164" x2="645" y2="180" stroke="#41ba1b" stroke-width="2.2"/>
  <rect x="594" y="164" width="16" height="16" fill="#41ba1b" transform="rotate(45 602 172)"/>
  <rect x="990" y="158" width="165" height="28" fill="#41ba1b" fill-opacity="0.12"/>
  <text x="1072" y="176" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#1c6d00" text-anchor="middle">WITHIN TOLERANCE</text>
  <text x="1072" y="200" font-size="10" font-weight="500" fill="#5a6a78" text-anchor="middle">CI entirely below &#916;</text>

  <!-- row 2: demographic parity  illustrative: whole CI above the band -> EXCEEDS TOLERANCE -->
  <text x="510" y="224" font-size="15" font-weight="600" fill="#2e4057">Demographic parity</text>
  <line x1="770" y1="246" x2="893" y2="246" stroke="#b6573a" stroke-width="2.2"/>
  <line x1="770" y1="238" x2="770" y2="254" stroke="#b6573a" stroke-width="2.2"/>
  <line x1="893" y1="238" x2="893" y2="254" stroke="#b6573a" stroke-width="2.2"/>
  <rect x="822" y="238" width="16" height="16" fill="#b6573a" transform="rotate(45 830 246)"/>
  <rect x="990" y="232" width="165" height="28" fill="#b6573a" fill-opacity="0.12"/>
  <text x="1072" y="250" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#b6573a" text-anchor="middle">EXCEEDS TOLERANCE</text>
  <text x="1072" y="274" font-size="10" font-weight="500" fill="#5a6a78" text-anchor="middle">CI entirely above &#916;</text>

  <!-- row 3: calibration error gap  illustrative: CI straddles the band -> INCONCLUSIVE -->
  <text x="510" y="316" font-size="14.5" font-weight="600" fill="#2e4057">Calibration error gap (&#916;ECE)</text>
  <line x1="588" y1="338" x2="817" y2="338" stroke="#4e6078" stroke-width="2.2"/>
  <line x1="588" y1="330" x2="588" y2="346" stroke="#4e6078" stroke-width="2.2"/>
  <line x1="817" y1="330" x2="817" y2="346" stroke="#4e6078" stroke-width="2.2"/>
  <rect x="695" y="330" width="16" height="16" fill="#4e6078" transform="rotate(45 703 338)"/>
  <rect x="990" y="324" width="165" height="28" fill="#4e6078" fill-opacity="0.12"/>
  <text x="1072" y="342" font-size="11.5" font-weight="800" letter-spacing="0.6" fill="#4e6078" text-anchor="middle">INCONCLUSIVE</text>
  <text x="1072" y="366" font-size="10" font-weight="500" fill="#5a6a78" text-anchor="middle">CI overlaps &#916;</text>

  <!-- axis -->
  <line x1="545" y1="356" x2="975" y2="356" stroke="#2e4057" stroke-width="1.3"/>
  <g stroke="#2e4057" stroke-width="1">
    <line x1="545" y1="356" x2="545" y2="364"/>
    <line x1="688" y1="356" x2="688" y2="364"/>
    <line x1="832" y1="356" x2="832" y2="364"/>
    <line x1="975" y1="356" x2="975" y2="364"/>
  </g>
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" fill="#5a6a78">
    <text x="545" y="380" text-anchor="middle">0.00</text>
    <text x="688" y="380" text-anchor="middle">0.10</text>
    <text x="832" y="380" text-anchor="middle">0.20</text>
    <text x="975" y="380" text-anchor="middle">0.30</text>
  </g>
  <text x="760" y="406" font-size="11" font-weight="600" letter-spacing="0.2" fill="#5a6a78" text-anchor="middle">Maximum between-group disparity with 95% uncertainty interval  ·  0 = parity</text>
</svg>
