<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .num { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .label { fill: #64748b; font-size: 11px; text-anchor: middle; dominant-baseline: hanging; }
    .connector { stroke: #e2e8f0; stroke-width: 2; }
  </style>

  <!-- Connectors -->
  <line class="connector" x1="68" y1="28" x2="892" y2="28"/>

  <!-- Phase 1 - green -->
  <circle cx="48" cy="28" r="22" fill="#22c55e"/>
  <text class="num" x="48" y="28">1</text>
  <text class="label" x="48" y="58">Data</text>
  <text class="label" x="48" y="72">Validation</text>

  <!-- Phase 2 - green -->
  <circle cx="144" cy="28" r="22" fill="#22c55e"/>
  <text class="num" x="144" y="28">2</text>
  <text class="label" x="144" y="58">Bias</text>
  <text class="label" x="144" y="72">Detection</text>

  <!-- Phase 3 - amber -->
  <circle cx="240" cy="28" r="22" fill="#f59e0b"/>
  <text class="num" x="240" y="28">3</text>
  <text class="label" x="240" y="58">Feature</text>
  <text class="label" x="240" y="72">Engineering</text>

  <!-- Phase 4 - green -->
  <circle cx="336" cy="28" r="22" fill="#22c55e"/>
  <text class="num" x="336" y="28">4</text>
  <text class="label" x="336" y="58">Fair</text>
  <text class="label" x="336" y="72">Training</text>

  <!-- Phase 5 - teal -->
  <circle cx="432" cy="28" r="22" fill="#64748b"/>
  <text class="num" x="432" y="28">5</text>
  <text class="label" x="432" y="58">Calibration</text>

  <!-- Phase 6 - blue -->
  <circle cx="528" cy="28" r="22" fill="#2563eb"/>
  <text class="num" x="528" y="28">6</text>
  <text class="label" x="528" y="58">Metrics &amp;</text>
  <text class="label" x="528" y="72">Testing</text>

  <!-- Phase 7 - dark blue -->
  <circle cx="624" cy="28" r="22" fill="#1e3a5f"/>
  <text class="num" x="624" y="28">7</text>
  <text class="label" x="624" y="58">CI/CD</text>
  <text class="label" x="624" y="72">Gating</text>

  <!-- Phase 8 - slate -->
  <circle cx="720" cy="28" r="22" fill="#475569"/>
  <text class="num" x="720" y="28">8</text>
  <text class="label" x="720" y="58">Monitoring</text>

  <!-- Phase 9 - slate -->
  <circle cx="816" cy="28" r="22" fill="#64748b"/>
  <text class="num" x="816" y="28">9</text>
  <text class="label" x="816" y="58">Dashboards</text>

  <!-- Phase 10 - purple -->
  <circle cx="912" cy="28" r="22" fill="#7c3aed"/>
  <text class="num" x="912" y="28">10</text>
  <text class="label" x="912" y="58">Model</text>
  <text class="label" x="912" y="72">Card</text>
</svg>
