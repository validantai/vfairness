# mutmut configuration (VB-TEST-9). Scoped to a small pure module so a baseline
# run is quick; the CI sweep (see .github/workflows/mutation.yml) widens the
# path to the metric core. mutmut reads this section; hatchling ignores it.
[mutmut]
paths_to_mutate=src/vfairness/_bands.py
runner=python -m pytest tests/test_bands.py -x -q
tests_dir=tests/
