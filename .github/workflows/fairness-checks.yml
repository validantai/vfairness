name: Fairness Checks

# ROOT-RELATIVE BY DESIGN, like every other workflow in this directory: it lives
# in the vfairness/ subtree of the private development monorepo and becomes
# active only in the PUBLIC repo (validantai/vfairness), where that subtree IS
# the repo root.
#
# `push` was added on 2026-08-28. Until then this ran on pull_request ONLY, so a
# commit pushed straight to main passed through no fairness gate at all, and the
# release snapshot lands exactly that way. Meanwhile docs/RELEASE_PIPELINE.md
# told readers the standing gates run on every push and pull request. Do not
# narrow this back to pull_request without correcting that claim in the same
# change.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege, declared rather than inherited. The default GITHUB_TOKEN
# permissions differ between repositories and can be changed in settings, so a
# workflow with no block at all is a workflow whose privileges nobody stated.
permissions:
  contents: read

jobs:
  fairness-gate:
    name: Fairness Gate Evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the report comment below. Job-level permissions REPLACE the
      # workflow-level block, so contents:read is repeated here.
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Torch first, from the CPU-only index. The default PyPI wheel on
          # Linux drags in the CUDA runtime (~2.5 GB installed) for a runner
          # that has no GPU; the cpu index is ~200 MB. The extras install below
          # then sees the requirement already satisfied and does not re-resolve
          # it. Keep this line ahead of the extras install.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # Every extra the test suite actually exercises. jinja2 for the SVG
          # rendering tests, matplotlib/seaborn for viz, PyWavelets for the
          # monitoring tests, xai + training for the explainability and
          # in-processing batteries, parity for the fairlearn/aif360 reference
          # comparison.
          #
          # DO NOT TRIM THIS LIST to shorten the job. Until 2026-08-27 it read
          # "[dev,rendering,viz,monitoring]" under a comment claiming the full
          # suite ran. It did not: 41 tests importorskip'd on torch, shap,
          # captum, lime, dice-ml and anchor, and 19 more on fairlearn/aif360,
          # in every environment including this one. Skips are invisible in the
          # summary line, so the run stayed green while the entire xai
          # subsystem, the torch fairness losses, and the regression pins for
          # two CRITICAL audit fixes had never once executed. The
          # VFAIRNESS_REQUIRE_BACKENDS gate below now turns any such gap into a
          # failure, but only if the backend is genuinely meant to be here.
          #
          # cicd added 2026-08-27: it carries PyYAML, which the shipped
          # `vfairness-precommit check-config` hook parses YAML fairness gate
          # configs with. Without it the two positive-path tests in
          # tests/test_packaging_hygiene.py importorskip, so the only thing CI
          # would prove about that hook is that it refuses to run.
          #
          # dashboard, causal and mcp added 2026-10-02, matching tests.yml and the
          # monorepo's vfairness-tests.yml. Run 36929555066 failed 106 tests here,
          # most of them because plotly was absent (the dashboard, documented-plot
          # and operations batteries), and without mcp the surface walk saw 1,568
          # units instead of the 1,580 the published ledger was measured on, so
          # the ledger, register and readiness tests failed on the environment
          # rather than on the documents. causal (dowhy) is added so this job runs
          # the causal battery instead of skipping it.
          pip install -e ".[dev,rendering,viz,dashboard,monitoring,causal,xai,training,parity,cicd,mcp]"

      - name: Run test suite with coverage
        env:
          # Asserts every optional backend the suite gates on is importable, so
          # a missing one FAILS by name (tests/test_optional_backends_present.py)
          # instead of silently subtracting tests from this run.
          VFAIRNESS_REQUIRE_BACKENDS: "1"
        run: |
          # Run the WHOLE suite (no '-m fairness' filter: that marker is carried
          # by zero tests, so it used to select nothing). Branch coverage is on
          # (branch=true in pyproject); --cov-fail-under sits just under the
          # measured baseline so coverage ratchets up over time.
          # -rs prints the reason for every skip, so an unreachable battery is
          # readable in the log rather than hidden behind the summary count.
          #
          # The gate was 40 while measured coverage was above 50, so it ratcheted
          # nothing: half the package could have stopped being tested without the
          # job noticing. Re-measured over the full suite on 2026-08-27:
          # 52.38% line+branch locally, 51.67% recomputed with the causal
          # subsystem removed (which approximates the extras installed here).
          # 48 keeps a few points of headroom for platform variance while
          # actually catching a regression. Re-measure and raise it when the
          # figure moves up; do not lower it to make a red run green.
          # tests/test_packaging_hygiene.py pins this number.
          python -m pytest --tb=short -rs --junitxml=fairness-results.xml \
            --cov=vfairness --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=48

      - name: Run fairness gate
        id: gate
        run: |
          python -c "
          from vfairness import ModelFairnessGate, FairnessReportCard
          import json, sys

          # Load test data and model predictions
          # (customize this section for your project)
          # Example with mock data for demonstration:
          import numpy as np
          np.random.seed(42)
          n = 1000
          y_true = np.random.randint(0, 2, n)
          y_pred = np.random.randint(0, 2, n)
          protected = np.random.choice(['A', 'B'], n)

          gate = ModelFairnessGate(
              metrics=['demographic_parity_difference', 'equalized_odds_difference'],
              thresholds={
                  'demographic_parity_difference': 0.1,
                  'equalized_odds_difference': 0.1,
              },
          )

          decision = gate.evaluate(y_true, y_pred, protected)
          card = FairnessReportCard(decision, model_name='PR Model')
          report = card.to_markdown()

          # Write report for PR comment
          with open('fairness-report.md', 'w') as f:
              f.write(report)

          # Set output for status check
          if not decision.approved:
              print('::error::Fairness gate BLOCKED — see report')
              sys.exit(1)
          else:
              print(f'Fairness gate: {decision.status.value}')
          "

      - name: Comment PR with fairness report
        # pull_request ONLY. `context.issue.number` is undefined on a push, so
        # on a push run this step would throw and turn an otherwise green
        # fairness gate red for a reason that has nothing to do with fairness.
        # That is the trap the `push` trigger added on 2026-08-28 opens up.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('fairness-report.md', 'utf8');
            } catch (e) {
              body = '## Fairness Report\n\nFairness gate could not generate report.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fairness-results
          path: |
            fairness-results.xml
            coverage.xml

  # Resolves the DECLARED floors instead of whatever pip happens to pick today.
  #
  # DO NOT DELETE THIS JOB. Until 2026-08-27 pyproject declared
  # `scikit-learn>=1.0` and CI installed only the latest resolution, so the floor
  # was an assertion nobody ever ran. It was wrong: with sklearn 1.1.3 / 1.2.2 /
  # 1.3.2 the ExponentiatedGradient mitigation misses its own demographic-parity
  # constraint (violation 0.0516 against a 0.05 tolerance) and reports it as
  # enforced, and the suite's own pin says so. pandas was floored the same way:
  # below 2.2.1 the agent memory-contamination screen raises IndexError and
  # degrades to "could not be computed". The floors are now numpy 1.23.2,
  # pandas 2.2.1, scipy 1.9.2, scikit-learn 1.4.0, requests 2.25.0, and this job is
  # what keeps them honest: a floor that silently breaks a fairness guarantee
  # cannot ship again. Verified on this exact resolution 2026-08-27: no test fails
  # at the floor that does not also fail at the latest resolution.
  #
  # THE EXTRAS ARE FLOORED TOO (2026-10-02). This job used to install only the
  # core set, on the grounds that some extra floors (matplotlib 3.5, torch 1.9)
  # predated cp311 wheels. Those floors have since been raised to installable
  # ones, and leaving the extras out meant the floor of every optional backend
  # was again an assertion nobody ran. The first run with them installed found
  # floors that were simply false: plotly 5.0 rejects properties every heatmap
  # sets, fairlearn 0.10 lacks a metric the parity battery calls, mcp below
  # 1.14 crashes registering the tools, and torch 2.0 has no float16 CPU clamp.
  # It also found six library paths that only worked on newer versions (numpy
  # matrix_rank on an empty matrix, scipy pearsonr on inf, scipy
  # chi2_contingency(...).pvalue, sklearn 1.4 on bool dummies, shap 0.44 on zero
  # rows, and an eager matplotlib import that broke `python -W error -c "import
  # vfairness"`); those were fixed in the library. Every extra the main test
  # job installs is installed here at its declared floor. The tests that need
  # an extra still skip cleanly without it (needs_matplotlib, needs_torch,
  # ...), so a no-extras install also collects.
  dependency-floor:
    name: Lowest declared dependency versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          # The floor of requires-python, so the oldest declared dependency
          # versions are actually installable.
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Install at the lowest declared direct versions
        run: |
          set -euo pipefail
          # Every extra the main test job (tests.yml) installs, plus mcp, at
          # its lowest declared version.
          #
          # CPU torch, for the reason tests.yml gives: the default PyPI wheel
          # carries the CUDA runtime (about 2.5 GB) and has run this runner out
          # of disk. tests.yml pre-installs the CPU wheel and relies on pip
          # keeping it; that does NOT work here, because the lowest-direct
          # resolution replaces a pre-installed torch with the PyPI build.
          # --torch-backend cpu routes torch to the CPU index inside the same
          # resolution instead. Checked 2026-10-02 with `uv pip compile
          # --python-platform x86_64-manylinux_2_28 --torch-backend cpu
          # --resolution lowest-direct`: torch==2.1.0+cpu, no CUDA torch wheels.
          uv pip install --system --torch-backend cpu --resolution lowest-direct \
            -e ".[rendering,viz,dashboard,monitoring,causal,xai,training,parity,cicd,mcp]"
          # Test tooling is not part of the contract under test, so it resolves
          # normally. None of these depends on the scientific stack, so this
          # cannot lift the floors installed above. hypothesis and ipython come
          # from the dev extra (property tests, notebook tests). networkx is no
          # longer listed: the causal extra above now brings it at its floor.
          uv pip install --system pytest hypothesis ipython
          python - <<'PY'
          from importlib.metadata import version
          names = ["numpy", "pandas", "scipy", "scikit-learn", "requests", "jinja2",
                   "matplotlib", "seaborn", "plotly", "PyWavelets", "torch", "shap",
                   "lime", "dice-ml", "captum", "anchor-exp", "sage-importance",
                   "fairlearn", "aif360", "dowhy", "networkx", "PyYAML", "mcp"]
          print("resolved floor:", ", ".join(f"{n} {version(n)}" for n in names))
          PY

      - name: Install gitleaks (pinned + checksum-verified)
        # Same pin and checksum as tests.yml and secret-scan.yml: two tests prove the secret-scan gate by RUNNING it
        # and fail closed (could-not-check) when the scanner is absent.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run test suite at the dependency floor
        run: python -m pytest --tb=short -rs -q
