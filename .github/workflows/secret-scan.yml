name: Secret Scan

# Ongoing credential hygiene (VF-9). A one-off history scan is not a gate:
# nothing in it stops the NEXT commit from adding a key. This job is the gate,
# and it runs on every push and pull request.
#
# ROOT-RELATIVE BY DESIGN. This file lives in the vfairness/ subtree of the
# private development monorepo and becomes active only in the PUBLIC repo
# (validantai/vfairness), where that subtree IS the repo root. There is no
# `vfairness/` path prefix and no `defaults.run.working-directory` here, unlike
# the monorepo's own copy of this gate.
#
# This is the SECOND line, not the first. Content reaches this repository as a
# release snapshot exported from the private monorepo, and that export runs
# gitleaks over the tree as a hard, unbypassable requirement before it pushes
# anything. This job covers what the export cannot: a commit made directly here,
# a pull request from a contributor, and the accumulated history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a secret committed on a branch that never opens a pull request
    # is still found. Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history, all refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # A shallow clone would scan only the tip and report clean on a repo
          # whose history holds a key. The whole point is the history.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From the release's own checksums.txt, re-verified by downloading the
          # asset on 2026-08-28. Pinned rather than "latest" so this job cannot
          # change behaviour under us, and verified so a compromised release
          # cannot run as root here.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove the scanner detects before trusting that it found nothing
        run: |
          set -euo pipefail
          # A clean result from a misconfigured scanner is indistinguishable
          # from a clean result from a working one: both print "no leaks
          # found". This step plants a secret the default ruleset is NOT
          # entitled to allowlist and fails the job if gitleaks misses it.
          #
          # IT MUST NOT BE A DOCUMENTATION EXAMPLE. The first attempt at this
          # control (2026-08-27) planted the canonical AWS example access key
          # id, which gitleaks deliberately allowlists as known-fake, so the
          # control "passed" by finding nothing and proved nothing at all.
          #
          # THE PLANTED VALUE IS ASSEMBLED FROM FRAGMENTS AT RUN TIME, AND THAT
          # IS LOAD-BEARING. DO NOT REJOIN IT INTO A LITERAL. A working control
          # value is by construction something a secret scanner flags, so
          # writing it out in full makes the workflow file itself a finding. The
          # monorepo's copy of this file does exactly that and its own Secret
          # Scan has been failing on it: run 33168267427 (2026-08-28) reports
          # "leaks found: 1", rule stripe-access-token, in the scan step of
          # .github/workflows/secret-scan.yml itself. Worse, this repository
          # receives content through an export whose gitleaks gate has no
          # override, so a literal here would make the release snapshot
          # unpublishable rather than merely noisy.
          #
          # Measured 2026-08-28 with gitleaks 8.30.1: gitleaks over this file
          # exits 0 (clean), and gitleaks over the file the line below writes
          # exits 1 (detected). Both halves have to hold; re-check both if the
          # fragments ever change.
          tmp="$(mktemp -d)"
          printf 'STRIPE = "%s_%s_%s"\n' 'sk' 'live' '4eC39HqLyjWDarjtT1zdp7dc' > "$tmp/planted.py"
          if gitleaks dir --no-banner --redact --exit-code=1 "$tmp" >/dev/null 2>&1; then
            echo "::error::Positive control FAILED: gitleaks did not flag a planted live secret."
            echo "The scanner is misconfigured or its ruleset is broken. A clean"
            echo "result from this job would be meaningless, so the job fails here."
            exit 1
          fi
          echo "Positive control OK: the scanner flags a planted secret."
          rm -rf "$tmp"

      - name: Scan every ref, full history
        run: |
          set -euo pipefail
          # --log-opts=--all so branches and tags are covered, not just the
          # checked-out tip. A secret on an unmerged branch is still in the repo.
          set +e
          gitleaks git --log-opts="--all" --no-banner --redact \
                   --report-format=sarif --report-path=gitleaks.sarif \
                   --exit-code=1 . 2>&1 | tee gitleaks.log
          rc=${PIPESTATUS[0]}
          set -e
          # A file gitleaks could not READ is not a file that passed: gitleaks
          # exits 0 on a read error, printing an ERR line that the "no leaks
          # found" summary then covers. Measured 2026-08-27. Check the output,
          # not only the exit code.
          if grep -qiE 'could not read|failed to' gitleaks.log; then
            echo "::error::gitleaks could not read one or more files; they were NOT scanned."
            exit 1
          fi
          exit "$rc"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-sarif
          path: |
            gitleaks.sarif
            gitleaks.log
          if-no-files-found: ignore
